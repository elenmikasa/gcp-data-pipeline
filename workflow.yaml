main:
  steps:
    # ----------------------------------------------------
    # ① 環境変数からプロジェクトIDを取得して変数に代入
    # ----------------------------------------------------
    - init:
        assign:
          - PROJECT_ID: ${sys.get_env("PROJECT_ID")}
          - DATASET_NAME: "marts"
          - TABLE_NAME: "fct_imbalance_prices"
          - fetch_job_result: null
          - process_job_result: null
          - spot_summary_job_result: null

    # ----------------------------------------------------
    # ② SQL文を分割して変数に格納（400文字制限対策）
    # ----------------------------------------------------
    - build_query:
        assign:
          - sql_part1: ${ "SELECT STRING_AGG(ym, ',' ORDER BY ym) AS months FROM (SELECT DISTINCT FORMAT_DATE('%Y%m', target_date) AS ym FROM `" + PROJECT_ID + "." + DATASET_NAME + "." + TABLE_NAME + "` WHERE DATE_DIFF(DATE(updated_at_jst), target_date, MONTH) BETWEEN 0 AND 1 UNION DISTINCT " }
          - sql_part2: ${ "SELECT FORMAT_DATE('%Y%m', tm) AS ym FROM UNNEST(GENERATE_DATE_ARRAY((SELECT COALESCE(DATE_TRUNC(MAX(target_date), MONTH), DATE_TRUNC(DATE_SUB(CURRENT_DATE('Asia/Tokyo'), INTERVAL 2 MONTH), MONTH)) FROM `" + PROJECT_ID + "." + DATASET_NAME + "." + TABLE_NAME + "`), DATE_TRUNC(CURRENT_DATE('Asia/Tokyo'), MONTH), INTERVAL 1 MONTH)) AS tm)" }

    # ----------------------------------------------------
    # ③ BigQueryで対象月を抽出
    # ----------------------------------------------------
    - query_bigquery:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${PROJECT_ID}
          body:
            location: us-central1
            useLegacySql: false
            query: ${ sql_part1 + sql_part2 }
        result: query_result

    # ----------------------------------------------------
    # ④ 結果からカンマ区切りの年月文字列を取り出す
    # ----------------------------------------------------
    - extract_months:
        assign:
          - target_months_str: ${query_result.rows[0].f[0].v}

    # ----------------------------------------------------
    # ⑤ インバランス処理とスポットサマリー取得を並列実行
    # ----------------------------------------------------
    - run_ingest_jobs_parallel:
        parallel:
          shared:
            - fetch_job_result
            - process_job_result
            - spot_summary_job_result
          branches:
            - imbalance_pipeline:
                steps:
                  - run_imbalance_fetch_job:
                      call: googleapis.run.v1.namespaces.jobs.run
                      args:
                        name: ${ "namespaces/" + PROJECT_ID + "/jobs/imbalance-fetch-job" }
                        location: asia-northeast1
                        body:
                          overrides:
                            containerOverrides:
                              - env:
                                  - name: TARGET_MONTHS
                                    value: ${target_months_str}
                      result: fetch_job_result
                  - run_process_imbalance_job:
                      call: googleapis.run.v1.namespaces.jobs.run
                      args:
                        name: ${ "namespaces/" + PROJECT_ID + "/jobs/process-imbalance-prices-job" }
                        location: asia-northeast1
                        body:
                          overrides:
                            containerOverrides:
                              - env:
                                  - name: TARGET_MONTHS
                                    value: ${target_months_str}
                      result: process_job_result
            - spot_summary_pipeline:
                steps:
                  - run_fetch_spot_summary_job:
                      call: googleapis.run.v1.namespaces.jobs.run
                      args:
                        name: ${ "namespaces/" + PROJECT_ID + "/jobs/fetch-spot-summary-job" }
                        location: asia-northeast1
                      result: spot_summary_job_result

    # ----------------------------------------------------
    # ⑥ Cloud Run Job (dbt-electricity-job) を起動
    # ----------------------------------------------------
    - run_dbt_electricity_job:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: ${ "namespaces/" + PROJECT_ID + "/jobs/dbt-electricity-job" }
          location: asia-northeast1
        result: dbt_job_result

    # ----------------------------------------------------
    # ⑦ 実行結果を返す
    # ----------------------------------------------------
    - return_result:
        return:
          executed_months: ${target_months_str}
          fetch_job_status: ${fetch_job_result}
          process_job_status: ${process_job_result}
          spot_summary_job_status: ${spot_summary_job_result}
          dbt_job_status: ${dbt_job_result}